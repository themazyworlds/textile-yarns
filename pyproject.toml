[project]
name = "textile-yarns"
version = "0.1.0"
description = "Official Capability Yarns Catalog for Textile AI OS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["yarns"]
extraPaths = [
    "yarns",
    "yarns/weave",
]
pythonVersion = "3.14"
pythonPlatform = "Linux"
