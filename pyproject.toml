[project]
name = "textile-yarns"
version = "0.1.0"
description = "Official Capability Yarns Catalog for Textile AI OS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbus-fast>=5.0.22",
    "httpx>=0.28.1",
    "livekit-agents[google]>=1.8.2",
    "mss>=10.2.0",
    "numpy>=2.2.0",
    "pillow>=12.3.0",
    "psutil>=7.0.0",
    "pydantic>=2.12.0",
    "pyxclip>=0.2.3",
    "textile",
    "trafilatura>=2.0.0",
]

[tool.uv.sources]
textile = { path = "../textile", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["yarns"]
extraPaths = [
    "yarns",
    "yarns/weave",
]
pythonVersion = "3.14"
pythonPlatform = "Linux"
