[project]
name = "textile-yarn-uwsm"
version = "1.0.0"
description = "Systemd and UWSM scope and session management integration"
authors = [{ name = "textile" }]
requires-python = ">=3.15"
dependencies = []

[tool.textile]
tailor = "textile"
layer = 150
resources = ["dbus:session", "env:XDG_RUNTIME_DIR", "env:TERMINAL"]

[tool.pyright]
extraPaths = [
    "../../../textile/textile-needle/src",
    "../../../textile/textile-core/src",
]
