[project]
name = "textile-yarn-ydotool"
version = "1.0.0"
description = "Synthetic mouse and keyboard input events via ydotool / uinput"
authors = [{ name = "textile" }]
requires-python = ">=3.15"
dependencies = [
    "pyxclip>=0.2.0",
]

[tool.textile]
tailor = "textile"
layer = 50
resources = ["socket:/tmp/.ydotool_socket", "socket:$XDG_RUNTIME_DIR/ydotool_socket"]

[tool.pyright]
extraPaths = [
    "../../../textile/textile-needle/src",
    "../../../textile/textile-core/src",
]
