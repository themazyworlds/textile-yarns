[project]
name = "textile-yarn-canvas"
version = "1.0.0"
description = "Quickshell GTK desktop visual presence canvas overlay"
authors = [{ name = "textile" }]
requires-python = ">=3.15"
dependencies = []

[tool.textile]
tailor = "textile"
layer = 100
resources = ["display:wayland", "display:x11", "dbus:session", "socket:$XDG_RUNTIME_DIR/quickshell"]

[tool.pyright]
extraPaths = [
    "../../../textile/textile-needle/src",
    "../../../textile/textile-core/src",
]
