[project]
name = "textile-yarn-weave"
version = "1.0.0"
description = "Embedded LiveKit and Gemini Realtime voice companion client"
authors = [{ name = "textile" }]
dependencies = [
    "livekit-agents[google]>=1.8.2",
]

[tool.textile]
layer = 150
resources = ["sound:pipewire", "sound:pulseaudio", "display:wayland"]

[tool.textile.settings]
model = "gemini-2.5-flash-native-audio-preview-12-2025"
voice = "Puck"
instructions = "You are Textile Weave, an ultra-fast, friendly, intelligent voice companion embedded into Linux desktop."
