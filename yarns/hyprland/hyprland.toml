[yarn]
name = "hyprland"
publisher = "textile"
version = "1.0.0"
manifest_version = 1
layer = 100
description = "Hyprland compositor IPC, workspace navigation, and window controls"
resources = ["socket:$XDG_RUNTIME_DIR/hypr", "env:HYPRLAND_INSTANCE_SIGNATURE", "env:XDG_RUNTIME_DIR"]

[dependencies]
python = []
system = ["hyprctl"]
